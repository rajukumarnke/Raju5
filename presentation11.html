<html>
<head>
<title>Student Marksheet</title>
<style>
    h2 {
        text-align: center;
    }
    table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
        background-color: #7cfc00 ;
        
    }
    table, th, td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
        background-color: #7cfc00 ;        
         
    }
    .info {
        width: 80%;
        margin: auto;
        margin-bottom: 20px;
    }
    input {
        padding: 5px;
    }
    .result {
        width: 80%;
        margin: auto;
        margin-top: 20px;
    }
  h2{ 
    background-color:red;
  }
  button{
    background-color:yellow;
    color:green;
  }
  p{
    color:red;
  }

</style>
</head>

<body>

<h2>Student Marksheet</h2>

<div class="info">
    Name: <input type="text" id="name"><br><br>
    Class: <input type="text" id="class"><br><br>
    Roll No: <input type="text" id="roll"><br><br>
    School: <input type="text" id="school"><br><br>
</div>

<table>
    <tr>
        <th>Subject</th>
        <th>Max Marks</th>
        <th>Obtained Marks</th>
    </tr>
    <tr>
        <td>Math</td>
        <td>100</td>
        <td><input type="number" id="m1"></td>
    </tr>
    <tr>
        <td>Science</td>
        <td>100</td>
        <td><input type="number" id="m2"></td>
    </tr>
    <tr>
        <td>English</td>
        <td>100</td>
        <td><input type="number" id="m3"></td>
    </tr>
    <tr>
        <td>Hindi</td>
        <td>100</td>
        <td><input type="number" id="m4"></td>
    </tr>
    <tr>
        <td>Social Science</td>
        <td>100</td>
        <td><input type="number" id="m5"></td>
    </tr>
</table>

<div class="result">
    <br>
             
    <button onclick="calculate()">Calculate Result</button>

    <p id="total"></p>
    <p id="percentage"></p>
    <p id="result"></p>
</div>

<script>
function calculate() {
    let m1 = Number(document.getElementById("m1").value);
    let m2 = Number(document.getElementById("m2").value);
    let m3 = Number(document.getElementById("m3").value);
    let m4 = Number(document.getElementById("m4").value);
    let m5 = Number(document.getElementById("m5").value);

    let total = m1 + m2 + m3 + m4 + m5;
    let percentage = (total / 500) * 100;

    let result = (percentage >= 33) ? "PASS" : "FAIL";

    document.getElementById("total").innerHTML = "Total Marks: " + total + " / 500";
    document.getElementById("percentage").innerHTML = "Percentage: " + percentage.toFixed(2) + "%";
    document.getElementById("result").innerHTML = "Result: " + result;
}
</script>

</body>
</html>
